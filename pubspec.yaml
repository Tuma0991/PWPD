name: pwpd
description: IoT Wearable Protection Device - Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  firebase_database: ^11.0.0
  cloud_firestore: ^5.1.0
  firebase_messaging: ^15.0.0

  # Maps
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  geolocator: ^12.0.0

  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.10
  lottie: ^3.1.0
  shimmer: ^3.0.0

  # Utilities
  url_launcher: ^6.2.6
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
